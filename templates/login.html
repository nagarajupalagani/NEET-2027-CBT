<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Login</title><style>body{font-family:Arial;background:#eef2f7;display:grid;place-items:center;height:100vh}.card{background:#fff;padding:30px;border-radius:12px;box-shadow:0 3px 15px #0002;width:min(380px,90%)}input,button{width:100%;padding:12px;margin:8px 0;box-sizing:border-box}button{background:#173b78;color:white;border:0;border-radius:7px;font-weight:bold}.err{color:#c62828}</style></head><body><div class="card"><h2>Teacher Dashboard</h2><p>NEET 2027 Physics • Test 01</p>{% if error %}<p class="err">{{error}}</p>{% endif %}<form method="post"><input type="password" name="password" placeholder="Teacher password" required><button>Login</button></form></div></body></html>
