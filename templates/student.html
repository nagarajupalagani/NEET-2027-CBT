<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEET CBT</title>
<style>body{font-family:Arial;margin:0;background:#eef2f7;color:#182033}header{background:#173b78;color:#fff;padding:14px;display:flex;justify-content:space-between;position:sticky;top:0}.timer{font-weight:bold;font-size:22px}.wrap{max-width:1050px;margin:20px auto;padding:0 12px}.card{background:#fff;padding:20px;border-radius:10px;box-shadow:0 2px 10px #0001;margin-bottom:15px}.grid{display:grid;grid-template-columns:1fr 230px;gap:15px}.opt{display:block;border:1px solid #ccd3df;padding:12px;margin:9px 0;border-radius:7px}.btn{padding:10px 14px;border:0;border-radius:7px;margin:5px;cursor:pointer;font-weight:bold}.primary{background:#173b78;color:#fff}.secondary{background:#e6eaf0}.review{background:#ffd86b}.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.pal button{height:34px;border:0;border-radius:5px}.answered{background:#39a56c!important;color:#fff}.marked{outline:3px solid #e7a400}.current{box-shadow:inset 0 0 0 3px #173b78}@media(max-width:750px){.grid{grid-template-columns:1fr}header{position:static}}</style></head>
<body><header><b>NEET 2027 PHYSICS • TEST 01</b><span class="timer" id="timer">60:00</span></header>
<div class="wrap"><div class="card" id="intro"><h2>CBT Instructions</h2><p>50 Questions • 60 minutes • 200 marks • +4 correct / −1 wrong</p><input id="name" placeholder="Student Name" style="padding:12px;width:90%;margin:5px"><input id="roll" placeholder="Roll Number" style="padding:12px;width:90%;margin:5px"><br><button class="btn primary" onclick="start()">Start Test</button></div>
<div class="grid" id="exam" style="display:none"><main class="card"><div id="q"></div><button class="btn secondary" onclick="prev()">Previous</button><button class="btn review" onclick="mark()">Mark for Review</button><button class="btn secondary" onclick="clearA()">Clear</button><button class="btn primary" onclick="next()">Save & Next</button></main><aside class="card"><b>Question Palette</b><div class="pal" id="pal"></div><hr><button class="btn primary" onclick="submitTest()">Submit Test</button></aside></div>
<div class="card" id="done" style="display:none"><h2>Submitted</h2><div id="result"></div></div></div>
<script>
const Q=[["Units & Measurements", "The dimensional formula of impulse is:", ["[MLT⁻¹]", "[ML²T⁻²]", "[MLT⁻²]", "[M⁰L⁰T⁰]"], 0], ["Units & Measurements", "Which pair has the same dimensions?", ["Work and torque", "Force and pressure", "Momentum and energy", "Power and impulse"], 0], ["Units & Measurements", "The SI unit of pressure is:", ["N", "Pa", "J", "W"], 1], ["Units & Measurements", "If x = at², the dimensions of a are:", ["[LT⁻¹]", "[LT⁻²]", "[L²T⁻²]", "[T⁻²]"], 1], ["Units & Measurements", "Which is dimensionless?", ["Strain", "Surface tension", "Young's modulus", "Pressure"], 0], ["Units & Measurements", "1 micrometre equals:", ["10⁻³ m", "10⁻⁶ m", "10⁻⁹ m", "10⁶ m"], 1], ["Units & Measurements", "The number of significant figures in 0.00450 is:", ["2", "3", "4", "5"], 1], ["Units & Measurements", "Percentage error in a quantity x = 20 ± 0.4 is:", ["0.5%", "2%", "4%", "20%"], 1], ["Units & Measurements", "Which equation can be checked using dimensional analysis?", ["F = ma", "v = u + at", "Both A and B", "Neither"], 2], ["Units & Measurements", "Dimensional analysis cannot determine:", ["Dimensions of a quantity", "Whether an equation is homogeneous", "Numerical dimensionless constants", "Dimensions of a product"], 2], ["Units & Measurements", "The dimensional formula of gravitational constant G is:", ["[MLT⁻²]", "[M⁻¹L³T⁻²]", "[ML³T⁻²]", "[M⁻¹L²T⁻¹]"], 1], ["Units & Measurements", "If length is measured with 2% error, the percentage error in area is:", ["1%", "2%", "4%", "8%"], 2], ["Units & Measurements", "A vernier calipers is primarily used to measure:", ["Only time", "Length/diameter/depth", "Mass", "Temperature"], 1], ["Units & Measurements", "Which is an SI base quantity?", ["Force", "Energy", "Electric current", "Pressure"], 2], ["Units & Measurements", "The SI unit of frequency is:", ["rad/s", "Hz", "N", "C"], 1], ["Motion in a Straight Line", "The slope of a position-time graph gives:", ["Acceleration", "Velocity", "Displacement", "Force"], 1], ["Motion in a Straight Line", "The area under a velocity-time graph gives:", ["Acceleration", "Displacement", "Jerk", "Speed"], 1], ["Motion in a Straight Line", "A particle starts from rest with acceleration 2 m/s². Its speed after 5 s is:", ["5 m/s", "10 m/s", "20 m/s", "25 m/s"], 1], ["Motion in a Straight Line", "A body moving with constant velocity has:", ["Zero acceleration", "Increasing acceleration", "Constant non-zero acceleration", "Changing speed"], 0], ["Motion in a Straight Line", "A particle has u = 10 m/s, a = −2 m/s². Time to stop is:", ["2 s", "5 s", "10 s", "20 s"], 1], ["Motion in a Straight Line", "For uniformly accelerated motion, which relation is correct?", ["v = u + at", "v = u + a/t", "s = ut + at", "v² = u² + as"], 0], ["Motion in a Straight Line", "A car travels 20 m in first 2 s and 40 m in next 2 s. Its acceleration is:", ["2.5 m/s²", "5 m/s²", "10 m/s²", "15 m/s²"], 1], ["Motion in a Straight Line", "If x = 3t² + 2t + 1, velocity at t = 2 s is:", ["8 m/s", "10 m/s", "14 m/s", "16 m/s"], 2], ["Motion in a Straight Line", "If x = 4t³, acceleration at t = 1 s is:", ["4 m/s²", "8 m/s²", "24 m/s²", "12 m/s²"], 2], ["Motion in a Straight Line", "A freely falling body starts from rest. Taking g = 10 m/s², displacement in 3 s is:", ["15 m", "30 m", "45 m", "90 m"], 2], ["Motion in a Straight Line", "At the highest point of a vertically thrown ball, its:", ["Velocity and acceleration are zero", "Velocity is zero, acceleration is g downward", "Acceleration is zero, velocity is g", "Both are maximum"], 1], ["Motion in a Straight Line", "Two cars move in the same direction with speeds 20 and 15 m/s. Relative speed is:", ["5 m/s", "15 m/s", "20 m/s", "35 m/s"], 0], ["Motion in a Straight Line", "Two objects move in opposite directions at 10 and 12 m/s. Relative speed is:", ["2 m/s", "10 m/s", "12 m/s", "22 m/s"], 3], ["Motion in a Straight Line", "A velocity-time graph is a horizontal line above the time axis. The body has:", ["Constant velocity", "Constant acceleration", "Increasing velocity", "Zero displacement"], 0], ["Motion in a Straight Line", "A particle covers equal distances in equal time intervals. It has:", ["Uniform speed", "Zero speed", "Variable speed", "Infinite acceleration"], 0], ["Motion in a Straight Line", "Average velocity is zero when:", ["Speed is zero throughout", "Net displacement is zero", "Distance is zero only", "Acceleration is zero"], 1], ["Motion in a Straight Line", "A body moves 10 m east and then 10 m west. Distance and displacement are:", ["0, 20 m", "20 m, 0", "10 m, 10 m", "20 m, 20 m"], 1], ["Motion in a Straight Line", "If acceleration is opposite to velocity, the speed:", ["Must increase", "Must decrease", "Must remain constant", "Becomes infinite"], 1], ["Motion in a Straight Line", "The instantaneous velocity is:", ["ds/dt", "dt/ds", "d²s/dt²", "s/t always"], 0], ["Motion in a Straight Line", "A particle's position is x = 5t − t². It changes direction at:", ["t = 2.5 s", "t = 5 s", "t = 10 s", "t = 0"], 0], ["Motion in a Plane", "A vector has components 3 and 4. Its magnitude is:", ["3", "4", "5", "7"], 2], ["Motion in a Plane", "Two perpendicular vectors of magnitudes 6 and 8 have resultant:", ["2", "10", "14", "48"], 1], ["Motion in a Plane", "If A·B = 0, the vectors are:", ["Parallel", "Perpendicular", "Anti-parallel", "Equal"], 1], ["Motion in a Plane", "The magnitude of A × B is maximum when angle between them is:", ["0°", "30°", "60°", "90°"], 3], ["Motion in a Plane", "For a projectile launched horizontally, horizontal acceleration is:", ["g", "−g", "0", "g/2"], 2], ["Motion in a Plane", "A projectile is launched at 20 m/s at 30°. Taking g = 10 m/s², time of flight is:", ["1 s", "2 s", "3 s", "4 s"], 1], ["Motion in a Plane", "For a projectile on level ground, maximum range occurs at:", ["30°", "45°", "60°", "90°"], 1], ["Motion in a Plane", "For a projectile on level ground, range is:", ["u² sinθ/g", "u² sin2θ/g", "u² cos2θ/g", "2u²/g"], 1], ["Motion in a Plane", "At the highest point of projectile motion, the vertical component of velocity is:", ["u", "u cosθ", "0", "g"], 2], ["Motion in a Plane", "At the highest point of a projectile, acceleration is:", ["Zero", "g upward", "g downward", "Horizontal"], 2], ["Motion in a Plane", "For projectile motion without air resistance, horizontal velocity is:", ["Constant", "Zero", "Increasing", "Decreasing"], 0], ["Motion in a Plane", "A projectile is fired at 30° and another at 60° with same speed. Their ranges are:", ["First larger", "Second larger", "Equal", "Cannot compare"], 2], ["Motion in a Plane", "If a vector A = 3i + 4j, its unit vector is:", ["3i+4j", "(3/5)i+(4/5)j", "(4/5)i+(3/5)j", "5i+5j"], 1], ["Motion in a Plane", "The angle between vectors A and −A is:", ["0°", "45°", "90°", "180°"], 3], ["Motion in a Plane", "If two vectors of magnitudes 5 and 12 are perpendicular, their resultant is:", ["7", "13", "17", "60"], 1]];let i=0,a=Array(Q.length).fill(null),m=Array(Q.length).fill(false),startT=0,remain=3600,active=false,submitted=false;
function start(){let n=document.getElementById('name').value.trim(),r=document.getElementById('roll').value.trim();if(!n||!r)return alert("Enter name and roll number.");document.getElementById('intro').style.display='none';document.getElementById('exam').style.display='grid';active=true;startT=Date.now();render();tick()}
function render(){let q=Q[i],s='<b>Question '+(i+1)+' of '+Q.length+'</b><p><b>'+q[0]+'</b></p><h3>'+q[1]+'</h3>';q[2].forEach((x,j)=>s+='<label class="opt"><input type="radio" name="o" '+(a[i]===j?'checked':'')+' onchange="a[i]='+j+'"> '+String.fromCharCode(65+j)+'. '+x+'</label>');document.getElementById('q').innerHTML=s;palette()}
function palette(){document.getElementById('pal').innerHTML=Q.map((_,j)=>'<button class="'+(a[j]!=null?'answered ':'')+(m[j]?'marked ':'')+(j==i?'current':'')+'" onclick="i='+j+';render()">'+(j+1)+'</button>').join('')}
function next(){if(i<Q.length-1){i++;render()}else submitTest()}function prev(){if(i>0){i--;render()}}function mark(){m[i]=!m[i];palette()}function clearA(){a[i]=null;render()}
async function submitTest(){
    if(!active || submitted) return;

    if(!confirm("Submit test now?")) return;

    submitted = true;
    active = false;

    let elapsed = 3600 - remain;

    let res = await fetch('/submit', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            name: document.getElementById('name').value.trim(),
            roll: document.getElementById('roll').value.trim(),
            answers: a,
            elapsed: elapsed
        })
    });

    let d = await res.json();

    if(d.id){
        window.location.href = '/response/' + d.id;
    }else{
        alert("Test submitted, but response sheet could not be opened.");
    }
}
function tick(){if(!active)return;let x=3600-Math.floor((Date.now()-startT)/1000);remain=Math.max(0,x);document.getElementById('timer').textContent=String(Math.floor(remain/60)).padStart(2,'0')+':'+String(remain%60).padStart(2,'0');if(remain<=0){submitted=true;active=false;fetch('/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('name').value.trim(),roll:document.getElementById('roll').value.trim(),answers:a,elapsed:3600})}).then(()=>location.reload())}else setTimeout(tick,500)}
</script></body></html>
